   <text style="font-size: 10px; font-family: 'S?hne'; fill: #62686e" transform="translate(617.76 552.037125)">new snowfall, not just surviving ice.</text>
  </g>
  <g id="text_46">
   <text style="font-size: 8px; font-family: 'S?hne'; fill: #62686e" transform="translate(51.48 550.648)">Source: Sentinel-2 SR Harmonized + Cloud Score+ · July–September, 2018–2025</text>
   <text style="font-size: 8px; font-family: 'S?hne'; fill: #62686e" transform="translate(51.48 563.4)">Percentages describe the selected observation, not the fraction of days with frozen surfaces.</text>
  </g>
 </g>
