  <g id="text_33">
   <text style="font-size: 8px; font-family: 'S?hne'; fill: #62686e" transform="translate(51.48 391.024)">All eight Septembers have a valid observation. Widespread bright cover in 2021 is consistent with snow-covered conditions; its age is unresolved.</text>
   <text style="font-size: 8px; font-family: 'S?hne'; fill: #62686e" transform="translate(51.48 403.776)">No trend line, melt-out estimate or genetic ice classification is inferred. Contains modified Copernicus Sentinel data (2018–2025).</text>
